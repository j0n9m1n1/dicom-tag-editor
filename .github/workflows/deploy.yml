name: Deploy DICOM Tag Editor to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run regression tests
        run: node --test tests/*.test.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact with cache busting
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js robots.txt sitemap.xml og-image.png _site/
          cp -r src icons _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          VER="${GITHUB_SHA::8}"
          python3 - "$VER" <<'EOF'
          import datetime, pathlib, re, sys
          ver = sys.argv[1]
          idx = pathlib.Path("_site/index.html")
          html = idx.read_text(encoding="utf-8")
          html = html.replace('./src/styles.css', f'./src/styles.css?v={ver}')
          html = html.replace('./src/main.js', f'./src/main.js?v={ver}')
          idx.write_text(html, encoding="utf-8")
          for js in pathlib.Path("_site/src").rglob("*.js"):
              txt = js.read_text(encoding="utf-8")
              txt = re.sub(r"""(from\s+['"])(\.[^'"]+\.js)(['"])""", rf"\1\2?v={ver}\3", txt)
              js.write_text(txt, encoding="utf-8")
          sw = pathlib.Path("_site/sw.js")
          sw_txt = sw.read_text(encoding="utf-8")
          sw_txt = sw_txt.replace("const CACHE_VERSION = 'dev';", f"const CACHE_VERSION = '{ver}';")
          sw_txt = re.sub(r"""'(\./src/[^']+\.(?:js|css))'""", rf"'\1?v={ver}'", sw_txt)
          sw.write_text(sw_txt, encoding="utf-8")
          sm = pathlib.Path("_site/sitemap.xml")
          today = datetime.date.today().isoformat()
          sm.write_text(re.sub(r"<lastmod>[^<]+</lastmod>", f"<lastmod>{today}</lastmod>", sm.read_text(encoding="utf-8")), encoding="utf-8")
          print(f"Applied cache-busting query ?v={ver} and sitemap lastmod={today}")
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
