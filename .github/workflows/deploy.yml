name: Deploy DICOM Tag Editor to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact with cache busting
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml og-image.png _site/
          cp -r src _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          VER="${GITHUB_SHA::8}"
          python3 - "$VER" <<'EOF'
          import pathlib, re, sys
          ver = sys.argv[1]
          idx = pathlib.Path("_site/index.html")
          html = idx.read_text(encoding="utf-8")
          html = html.replace('./src/styles.css', f'./src/styles.css?v={ver}')
          html = html.replace('./src/main.js', f'./src/main.js?v={ver}')
          idx.write_text(html, encoding="utf-8")
          for js in pathlib.Path("_site/src").rglob("*.js"):
              txt = js.read_text(encoding="utf-8")
              txt = re.sub(r"""(from\s+['"])(\.[^'"]+\.js)(['"])""", rf"\1\2?v={ver}\3", txt)
              js.write_text(txt, encoding="utf-8")
          print(f"Applied cache-busting query ?v={ver}")
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
